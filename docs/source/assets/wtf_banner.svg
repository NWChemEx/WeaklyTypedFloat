<svg viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" width="1280" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .tattoo { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 700; }
  .mono   { font-family: 'JetBrains Mono', 'Courier New', monospace; }
</style>

<!-- Background -->
<rect width="1280" height="320" fill="#0d1a0e"/>

<!-- Subtle grid -->
<g stroke="#ffffff" stroke-opacity="0.018" stroke-width="0.5">
  <line x1="0" y1="80" x2="1280" y2="80"/>
  <line x1="0" y1="160" x2="1280" y2="160"/>
  <line x1="0" y1="240" x2="1280" y2="240"/>
  <line x1="320" y1="0" x2="320" y2="320"/>
  <line x1="640" y1="0" x2="640" y2="320"/>
  <line x1="960" y1="0" x2="960" y2="320"/>
</g>

