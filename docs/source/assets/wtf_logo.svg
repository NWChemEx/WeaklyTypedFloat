  <circle cx="240" cy="216" r="9"/> <circle cx="204" cy="238" r="9"/>
  <circle cx="180" cy="236" r="9"/> <circle cx="228" cy="234" r="8"/>
  <circle cx="154" cy="224" r="8"/>
</g>

<!-- TATTOOS -->
<g transform="rotate(-8 184 186)">
  <rect x="148" y="169" width="74" height="28" rx="5" fill="#1a472a" fill-opacity="0.88"/>
  <text x="185" y="188" text-anchor="middle" class="tattoo" font-size="17" fill="#a8e6a3">3.14</text>
</g>
<g transform="rotate(4 198 216)">
  <rect x="162" y="201" width="72" height="26" rx="5" fill="#1a472a" fill-opacity="0.88"/>
  <text x="198" y="219" text-anchor="middle" class="tattoo" font-size="15" fill="#7ecef8">3.14f</text>
</g>
<g transform="rotate(-4 190 246)">
  <rect x="154" y="232" width="72" height="24" rx="5" fill="#1a472a" fill-opacity="0.88"/>
  <text x="190" y="249" text-anchor="middle" class="tattoo" font-size="15" fill="#ffcb6b">3.14L</text>
</g>

<!-- Name + tagline – bottom of circle -->
<text x="200" y="340" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#a8d5a2">WeaklyTypedFloat</text>
<text x="200" y="360" text-anchor="middle" class="mono" font-size="10" font-weight="400" fill="#5aad50">Floating-point type-erasure</text>
</svg>
