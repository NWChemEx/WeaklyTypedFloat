<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .tattoo { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 700; }
  .mono   { font-family: 'JetBrains Mono', 'Courier New', monospace; }
</style>

<!-- Dark circular background -->
<circle cx="200" cy="200" r="198" fill="#0d1a0e"/>
<circle cx="200" cy="200" r="195" fill="#0f1f10"/>
<circle cx="200" cy="200" r="192" fill="none" stroke="#3a7030" stroke-width="1.5" stroke-opacity="0.6"/>

<!-- WTF badge – top centre -->
<rect x="158" y="18" width="84" height="26" rx="5" fill="#3a0a0a" stroke="#cc3333" stroke-width="1"/>
<text x="200" y="36" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#ff6b6b" letter-spacing="3">WTF</text>

<!-- ══ CHAMELEON – shifted left ~30px, raised ~10px vs previous ══ -->
