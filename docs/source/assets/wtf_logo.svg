  <ellipse cx="260" cy="167" rx="3"   ry="8"  transform="rotate(17  260 167)"/>
  <ellipse cx="275" cy="180" rx="2.5" ry="7"  transform="rotate(22  275 180)"/>
</g>

<!-- Scale texture -->
<g fill="none" stroke="#3a7030" stroke-width="0.6" stroke-opacity="0.5">
  <circle cx="180" cy="200" r="11"/><circle cx="204" cy="198" r="11"/>
  <circle cx="228" cy="202" r="10"/><circle cx="192" cy="220" r="10"/>
