<path d="M36 186 Q26 190 22 198 Q20 205 26 208 Q35 211 45 201 Q52 193 47 186 Z" fill="#5aad50"/>
<path d="M19 198 Q28 194 39 198 Q48 202 50 205" fill="none" stroke="#2e6025" stroke-width="1.5" stroke-linecap="round"/>

<!-- Eye -->
<ellipse cx="70" cy="164" rx="18" ry="20" fill="#3a7030"/>
<circle cx="70" cy="162" r="15" fill="#f5f5dc"/>
<circle cx="72" cy="160" r="9" fill="#1a472a"/>
<circle cx="72" cy="160" r="5.5" fill="#0d2b18"/>
<circle cx="75" cy="157" r="2" fill="white"/>
<path d="M54 159 Q70 149 86 159" fill="none" stroke="#3a7030" stroke-width="2.5" stroke-linecap="round"/>

<!-- Dorsal spines -->
