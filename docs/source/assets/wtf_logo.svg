<!-- Tail -->
<path d="M288 234 Q328 214 352 186 Q378 154 374 126 Q370 104 355 100 Q340 96 332 112 Q326 124 334 130 Q344 136 340 150 Q330 170 302 190 Q278 206 288 226 Z" fill="#4a8c3f"/>
