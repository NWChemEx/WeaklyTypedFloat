<ellipse cx="251" cy="295" rx="12" ry="6" fill="#3a7030" transform="rotate(6 251 295)"/>

<!-- Head -->
<ellipse cx="84" cy="182" rx="60" ry="46" fill="#4a8c3f"/>
<ellipse cx="80" cy="178" rx="54" ry="40" fill="#5aad50"/>
<!-- casque -->
<path d="M50 152 Q60 130 76 124 Q92 118 108 128 Q116 136 113 149 Q99 140 82 142 Q64 145 54 156 Z" fill="#3a7030"/>
